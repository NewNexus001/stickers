plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "de.loicezt.stickers"
    compileSdk 36
    ndkVersion = "29.0.14206865"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "de.loicezt.stickers"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
            def storeFileValue = keystoreProperties["storeFile"]
            def storePasswordValue = keystoreProperties["storePassword"]
            if (storeFileValue != null && storeFileValue != "") {
                storeFile = new File(storeFileValue)
            }
            if (storePasswordValue != null && storePasswordValue != "") {
                storePassword = storePasswordValue
            }
        }
    }
    buildTypes {
        release {
            if (keystoreProperties["storeFile"] != null && keystoreProperties["storeFile"] != "") {
                signingConfig signingConfigs.release
            } else {
                // No keystore configured (e.g. CI): fall back to the debug signing
                // config so the release APK is signed and can actually be installed.
                // Android refuses to install unsigned APKs. Replace with a real
                // keystore via key.properties before publishing to a store.
                signingConfig signingConfigs.debug
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
